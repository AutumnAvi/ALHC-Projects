[package]
name = "alhc-desktop"
version = "0.1.0"
description = "ALHC Projects for Mac and Windows: a Tauri shell around the hosted web app (docs/design/desktop.md)"
authors = ["Autumn Lake"]
license = "UNLICENSED"
publish = false
edition = "2021"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the library's name apart from the binary's (a Windows build quirk, from Tauri's template).
name = "alhc_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-window-state = "2.5"
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
