# Pull request and main checks. Scripts are the root package.json's. Since big move 2 the repo is an npm
# workspace (docs/design/monorepo.md): lint, typecheck, and test run in both packages (packages/core, then
# apps/web), build builds the app. One lockfile at the root; `npm ci` installs both packages.
# Node 22: the locked @supabase/* packages require Node >= 22.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # dorny/paths-filter reads the pull request file list.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (core, web)
        run: npm run lint

      # The core is checked without the DOM or Node types (packages/core/tsconfig.json).
      - name: Typecheck (core, web)
        run: npm run typecheck

      # packages/core/tests includes the boundaries (no Next.js, React, DOM, Node, server-only, process.env).
      - name: Unit tests (core, web)
        run: npm test

      - name: Build (web)
        run: npm run build

  db:
    name: db:test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            supabase:
              - 'supabase/**'

      # run.sh starts its own throwaway cluster (initdb). It only needs the
      # server binaries. postgresql-contrib provides pg_trgm. The runner is
      # not root, so initdb is allowed. The script finds initdb under
      # /usr/lib/postgresql when it is not on PATH.
      - name: Install PostgreSQL
        if: steps.changes.outputs.supabase == 'true'
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql postgresql-contrib

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.supabase == 'true'
        with:
          node-version: 22

      - name: Run database smoke tests
        if: steps.changes.outputs.supabase == 'true'
        run: npm run db:test

  # Big move 3 (docs/design/desktop.md): the desktop app (apps/desktop). The checks job above already lints,
  # type-checks, and tests its TypeScript with the rest of the workspace; this builds the launcher page and
  # checks the Rust shell on Linux (WebKitGTK): format, clippy in development and release configurations,
  # and the navigation-policy tests. Native (unsigned) macOS and Windows builds are desktop.yml's (it runs
  # when apps/desktop changes, or by hand).
  desktop:
    name: desktop (launcher, Rust shell)
    runs-on: ubuntu-latest
    # About 5 minutes normally; a slow Ubuntu mirror once took 24 of them on apt alone.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (desktop)
        run: npm run typecheck --workspace @alhc/desktop

      # The Rust build embeds apps/desktop/dist (tauri.conf.json → build.frontendDist).
      - name: Build the launcher page (desktop)
        run: npm run build:frontend --workspace @alhc/desktop

      # Tauri's Linux prerequisites (https://v2.tauri.app/start/prerequisites/#linux).
      - name: Install WebKitGTK and the Tauri build prerequisites
        run: >-
          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3
          libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # The version in apps/desktop/src-tauri/rust-toolchain.toml (bump both together).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      # Without the custom-protocol feature Tauri builds as under `tauri dev` (cfg(dev)); with it, as
      # `tauri build` does. Both must be warning-free.
      - name: cargo clippy (development and release configurations)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features tauri/custom-protocol -- -D warnings

      - name: cargo test (navigation policy)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
