# Pull request and main checks. Scripts are the ones in package.json.
# Node 22: the locked @supabase/* packages require Node >= 22.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # dorny/paths-filter reads the pull request file list.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    name: db:test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            supabase:
              - 'supabase/**'

      # run.sh starts its own throwaway cluster (initdb). It only needs the
      # server binaries. postgresql-contrib provides pg_trgm. The runner is
      # not root, so initdb is allowed. The script finds initdb under
      # /usr/lib/postgresql when it is not on PATH.
      - name: Install PostgreSQL
        if: steps.changes.outputs.supabase == 'true'
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql postgresql-contrib

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.supabase == 'true'
        with:
          node-version: 22

      - name: Run database smoke tests
        if: steps.changes.outputs.supabase == 'true'
        run: npm run db:test
